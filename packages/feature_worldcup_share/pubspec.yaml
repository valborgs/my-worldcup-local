name: feature_worldcup_share
description: My World Cup "share" feature module.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.24.0'

# feature 패키지는 다른 feature 패키지에 의존하지 않는다.
# 화면 간 이동은 worldcup_core의 AppRoutes 계약을 통해서만 한다.
dependencies:
  flutter:
    sdk: flutter
  worldcup_core:
    path: ../worldcup_core
  worldcup_domain:
    path: ../worldcup_domain
  worldcup_ui_kit:
    path: ../worldcup_ui_kit
  # 주변 기기 전송 플랫폼 채널. feature 패키지가 아니라 플러그인 계층이므로
  # file_picker / image_picker 와 같은 자리에 둔다.
  worldcup_nearby_transfer:
    path: ../worldcup_nearby_transfer
  flutter_riverpod: ^3.0.0
  path: ^1.9.0 # 받은 파일을 앱 저장소로 옮길 때 경로 조작
  path_provider: ^2.1.3 # 임시 / 문서 디렉터리

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
