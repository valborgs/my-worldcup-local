name: feature_worldcup_editor
description: My World Cup "editor" feature module.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.24.0'

# feature 패키지는 다른 feature 패키지에 의존하지 않는다.
# 화면 간 이동은 worldcup_core의 AppRoutes 계약을 통해서만 한다.
dependencies:
  flutter:
    sdk: flutter
  worldcup_core:
    path: ../worldcup_core
  worldcup_domain:
    path: ../worldcup_domain
  worldcup_ui_kit:
    path: ../worldcup_ui_kit
  flutter_riverpod: ^3.0.0
  file_picker: ^10.3.10 # 이미지 여러 장 한 번에 고르기
  image_picker: ^1.1.1 # 카메라 / 갤러리에서 한 장 고르기
  dotted_border: ^2.1.0 # 항목 추가 영역의 점선 박스

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
