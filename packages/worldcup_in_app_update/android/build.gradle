plugins {
    id 'com.android.library'
}

group = 'org.comon.worldcup_in_app_update'
version = '1.0.0'

android {
    namespace 'org.comon.worldcup_in_app_update'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 23
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Play In-App Update. 예전 통합 아티팩트(com.google.android.play:core)는
    // 폐기되었고, 인앱 업데이트는 이 단독 아티팩트로 분리되었다.
    implementation 'com.google.android.play:app-update:2.1.0'
}
