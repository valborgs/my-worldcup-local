name: worldcup_nearby_transfer
description: Project-local Google Nearby Connections transport for My World Cup.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.3 # 프로토콜 테스트가 네이티브 소스의 해시를 검증한다
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.comon.worldcup_nearby_transfer
        pluginClass: WorldcupNearbyTransferPlugin
      ios:
        pluginClass: WorldcupNearbyTransferPlugin
