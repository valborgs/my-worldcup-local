name: feature_worldcup_list
description: My World Cup "list" feature module.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.24.0'

# feature 패키지는 다른 feature 패키지에 의존하지 않는다.
# 화면 간 이동은 worldcup_core의 AppRoutes 계약을 통해서만 한다.
dependencies:
  flutter:
    sdk: flutter
  worldcup_core:
    path: ../worldcup_core
  worldcup_domain:
    path: ../worldcup_domain
  worldcup_ui_kit:
    path: ../worldcup_ui_kit
  flutter_riverpod: ^3.0.0
  google_mobile_ads: ^9.1.0 # 목록 화면 배너 광고
  file_picker: ^10.3.10 # 월드컵 패키지 파일 가져오기

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
